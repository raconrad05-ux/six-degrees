<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Six Degrees of Wikipedia{% endblock %}</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      max-width: 640px;
      margin: 40px auto;
      padding: 0 16px;
      color: #222;
      background: #fafafa;
      line-height: 1.5;
    }
    header a { color: #222; text-decoration: none; font-weight: bold; font-size: 1.3em; }
    a { color: #0645ad; }
    label { display: block; margin-top: 12px; font-weight: 600; }
    input[type=text] {
      width: 100%;
      padding: 8px;
      font-size: 1em;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      margin-top: 16px;
      padding: 8px 16px;
      font-size: 1em;
      color: #fff;
      background: #0645ad;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { background: #0b0080; }
    ol li { margin: 4px 0; }
    .stats { color: #666; }
  </style>
</head>
<body>
  <header><a href="{{ url_for('home') }}">Six Degrees of Wikipedia</a></header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
